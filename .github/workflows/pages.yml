name: Publish web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --path . --editor --import
      - name: Run rules tests
        run: godot --headless --path . --script tests/run_rules.gd
      - name: Export web build
        run: |
          mkdir -p builds/web
          godot --headless --path . --export-release Web
          touch builds/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web
      - id: deployment
        uses: actions/deploy-pages@v4
